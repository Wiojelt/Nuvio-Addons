name: Publish WioSpor live addon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/addons/wiospor/**'
      - 'scripts/build-wiospor-live.mjs'
      - 'scripts/generate-wiospor.mjs'
      - 'scripts/validate.mjs'
      - 'tests/**'
      - 'generated/wiospor/**'
      - 'config/wiospor-source-specs.bootstrap.json'
      - 'package.json'
      - '.github/workflows/publish-live.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: wiospor-live-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh upstream snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_GH_TOKEN: ${{ secrets.UPSTREAM_GH_TOKEN }}
        run: npm run sync

      - name: Generate adapters and catalog
        run: npm run generate

      - name: Validate source tree
        run: npm test

      - name: Load previous live snapshot
        run: |
          mkdir -p .previous-live
          if git fetch origin live:refs/remotes/origin/live; then
            git archive origin/live | tar -x -C .previous-live
          else
            echo 'No previous live branch yet'
          fi

      - name: Load Domates credential securely
        env:
          DOMATES_GOOGLE_API_KEY: ${{ secrets.DOMATES_GOOGLE_API_KEY }}
          UPSTREAM_GH_TOKEN: ${{ secrets.UPSTREAM_GH_TOKEN }}
        run: |
          if [ -n "$DOMATES_GOOGLE_API_KEY" ]; then
            printf 'DOMATES_GOOGLE_API_KEY=%s\n' "$DOMATES_GOOGLE_API_KEY" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$UPSTREAM_GH_TOKEN" ]; then
            echo 'Domates credential unavailable; other WioSpor sources will still be published.'
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          url = 'https://api.github.com/repos/Wiojelt/TurkSpor-Source/contents/DomatesTV/src/main/kotlin/turkspor/domates/DomatesTVProvider.kt'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['UPSTREAM_GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'wio-live-bot'
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              payload = json.load(r)
          source = base64.b64decode(payload['content']).decode('utf-8')
          match = re.search(r'private val apiKey\s*=\s*secret\("([A-Za-z0-9+/=]+)"\)', source)
          if not match:
              raise SystemExit('Domates key marker changed in private upstream')
          key = base64.b64decode(match.group(1)).decode('utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('DOMATES_GOOGLE_API_KEY=' + key + '\n')
          PY

      - name: Resolve channels and build static addon
        env:
          LIVE_PREVIOUS_DIR: .previous-live
          WIOSPOR_LIVE_CONCURRENCY: '8'
          WIOSPOR_STALE_MAX_MS: '5400000'
          MIN_LIVE_STREAM_CHANNELS: '1'
        run: npm run build:live

      - name: Publish live branch
        run: |
          mkdir -p /tmp/wiospor-live
          cp -R dist-live/. /tmp/wiospor-live/
          git checkout --orphan live-publish
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/wiospor-live/. .
          printf 'WioSpor live addon output. Generated by GitHub Actions.\n' > README.txt
          git add -A
          git config user.name 'wio-live-bot'
          git config user.email 'wio-live-bot@users.noreply.github.com'
          git commit -m 'chore(live): refresh WioSpor streams'
          git push --force origin HEAD:live
