name: Publish WioSpor live addon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/addons/wiospor/**'
      - 'scripts/build-wiospor-live.mjs'
      - 'scripts/generate-wiospor.mjs'
      - 'scripts/validate.mjs'
      - 'tests/**'
      - 'generated/wiospor/**'
      - 'config/wiospor-source-specs.bootstrap.json'
      - 'package.json'
      - '.github/workflows/publish-live.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: wiospor-live-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh upstream snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_GH_TOKEN: ${{ secrets.UPSTREAM_GH_TOKEN }}
        run: npm run sync

      - name: Generate adapters and catalog
        run: npm run generate

      - name: Validate source tree
        run: npm test

      - name: Load previous live snapshot
        run: |
          mkdir -p .previous-live
          if git fetch origin live:refs/remotes/origin/live; then
            git archive origin/live | tar -x -C .previous-live
          else
            echo 'No previous live branch yet'
          fi

      - name: Resolve channels and build static addon
        env:
          LIVE_PREVIOUS_DIR: .previous-live
          WIOSPOR_LIVE_CONCURRENCY: '4'
          WIOSPOR_STALE_MAX_MS: '5400000'
          MIN_LIVE_STREAM_CHANNELS: '1'
        run: npm run build:live

      - name: Publish live branch
        run: |
          mkdir -p /tmp/wiospor-live
          cp -R dist-live/. /tmp/wiospor-live/
          git checkout --orphan live-publish
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/wiospor-live/. .
          printf 'WioSpor live addon output. Generated by GitHub Actions.\n' > README.txt
          git add -A
          git config user.name 'wio-live-bot'
          git config user.email 'wio-live-bot@users.noreply.github.com'
          git commit -m 'chore(live): refresh WioSpor streams'
          git push --force origin HEAD:live
