name: Security scrub exposed credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-scrub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          key_re = re.compile(r'AIza[0-9A-Za-z_-]{35}')
          target = Path('src/addons/wiospor/legacy-sources.mjs')
          text = target.read_text(encoding='utf-8')
          text = re.sub(
              r"const DOMATES_KEY = ['\"]AIza[0-9A-Za-z_-]{35}['\"];",
              "const DOMATES_KEY = process.env.DOMATES_GOOGLE_API_KEY || '';",
              text,
          )
          target.write_text(text, encoding='utf-8')

          skip = {'.git', 'node_modules'}
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts):
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              clean = key_re.sub('REMOVED_GOOGLE_API_KEY', data)
              if clean != data:
                  path.write_text(clean, encoding='utf-8')

          remaining = []
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts):
                  continue
              try:
                  if key_re.search(path.read_text(encoding='utf-8')):
                      remaining.append(str(path))
              except (UnicodeDecodeError, OSError):
                  pass
          if remaining:
              raise SystemExit('Google API key pattern remains in: ' + ', '.join(remaining))
          PY

          git config user.name 'wio-security-bot'
          git config user.email 'wio-security-bot@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'security: remove embedded credentials'
          fi

      - name: Rewrite reachable history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          if git show-ref --verify --quiet refs/remotes/origin/live; then
            git branch -f live refs/remotes/origin/live
          fi

          python3 -m pip install --disable-pip-version-check --quiet git-filter-repo
          printf '%s\n' 'regex:AIza[0-9A-Za-z_-]{35}==>REMOVED_GOOGLE_API_KEY' > /tmp/replacements.txt

          refs=(refs/heads/main)
          if git show-ref --verify --quiet refs/heads/live; then
            refs+=(refs/heads/live)
          fi
          git filter-repo --force --replace-text /tmp/replacements.txt --refs "${refs[@]}"

          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          git push --force origin refs/heads/main:refs/heads/main
          if git show-ref --verify --quiet refs/heads/live; then
            git push --force origin refs/heads/live:refs/heads/live
          fi

      - name: Verify reachable history is clean
        run: |
          if git log --all -p -- . | grep -E 'AIza[0-9A-Za-z_-]{35}' >/dev/null; then
            echo 'Credential pattern still exists in reachable history.' >&2
            exit 1
          fi
          echo 'Reachable branches are clean.'
